#:schema https://json.schemastore.org/any.json

env_files = [".env"]
root = "."

[build]
  args_bin = []
  bin = "./tmp/api"
  cmd = "go build -o ./tmp/api cmd/api/main.go"
  delay = 1000
  entrypoint = ["./tmp/api"]
  exclude_dir = ["tmp", "bin", "build", "scripts", "migrations", "docs"]
  exclude_regex = ["_test.go"]
  include_ext = ["go", "tpl", "tmpl", "html"]
  stop_on_error = false
